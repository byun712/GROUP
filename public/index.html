<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153346"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png"><title>ELSOLTEC 그룹웨어</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><header><strong>ELSOLTEC</strong><span>우리의 업무를 한곳에서</span><button id="install-app" hidden>Windows 앱 설치</button><button id="logout" hidden>로그아웃</button></header><main><div id="message" role="status"></div><section id="login"><p class="eyebrow">WORKSPACE</p><h1>오늘도, 함께 시작합니다.</h1><p>회사 계정으로 로그인해 주세요.</p><form id="login-form"><label>아이디<input name="login" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form></section><div id="workspace" hidden><h1 id="welcome"></h1><p id="network"></p><nav><button data-tab="leave">휴가 전자결재</button><button data-tab="attendance">출퇴근</button><button data-tab="mail">메일</button><button data-tab="security">보안 설정</button></nav><section id="leave"><h2>휴가 신청</h2><form id="leave-form"><div class="row"><label>휴가 종류<select name="kind"><option>연차</option><option>오전 반차</option><option>오후 반차</option></select></label><label>시작일<input name="start" type="date" required></label><label>종료일<input name="end" type="date" required></label></div><label>사유<textarea name="reason" maxlength="2000" required></textarea></label><p>결재 순서 · 실장 → 대표이사</p><button>신청하기</button></form><h2>결재 문서</h2><div id="documents"></div></section><section id="attendance" hidden><h2>출퇴근 등록</h2><p>사무실 네트워크에서 등록할 수 있습니다. 기록은 한국 시간으로 표시됩니다.</p><button id="clock-in">출근 등록</button><button id="clock-out">퇴근 등록</button><form id="export-form"><label>내보낼 월<input id="export-month" type="month" required></label><button>내 근태 CSV 다운로드</button></form><div id="records"></div></section><section id="mail" hidden><h2>회사 메일</h2><p id="mail-description"></p><a href="https://webmail.elsoltec.com" target="_blank" rel="noopener noreferrer">카페24 웹메일 열기 ↗</a><p>메일 송수신은 웹메일에서 진행합니다. 그룹웨어에는 메일 비밀번호를 저장하지 않습니다.</p></section><section id="security" hidden><h2>계정 보안</h2><p>아이디와 비밀번호로 로그인합니다.</p><h2>비밀번호 변경</h2><form id="password-form"><label>현재 비밀번호<input name="current" type="password" autocomplete="current-password" required></label><label>새 비밀번호<input name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><button>변경 후 로그아웃</button></form></section></div></main><footer>ELSOLTEC · 초기 개발 버전</footer></body></html>
