name: UI regression
on:
  push:
    branches: [main, 'codex/workboard-validation']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/workboard-layout-smoke.mjs
      - run: node scripts/workboard-ui-smoke.mjs
      - run: node scripts/admin-attendance-smoke.mjs
      - run: node scripts/project-members-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-verification
          path: |
            /tmp/group-layout-ui
            /tmp/workboard-ui
            /tmp/group-admin-attendance-ui
            /tmp/group-project-members-ui
